  Giga Sketch placeholder splash: abstract brush strokes on a dark background.
  Kept dark at the top right, where the logo and loading text are drawn in white.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="3840" height="1920" viewBox="0 0 3840 1920">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1c2b"/>
      <stop offset="1" stop-color="#0a0b11"/>
    </linearGradient>
    <linearGradient id="warm" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff5f6d"/>
      <stop offset="1" stop-color="#ffc371"/>
    </linearGradient>
    <linearGradient id="cool" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2ec4b6"/>
      <stop offset="1" stop-color="#3a86ff"/>
    </linearGradient>
    <filter id="glow" filterUnits="userSpaceOnUse" x="-600" y="-600" width="5040" height="3120"><feGaussianBlur stdDeviation="70"/></filter>
    <filter id="soft" x="-5%" y="-20%" width="110%" height="140%"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>
  <rect width="3840" height="1920" fill="url(#bg)"/>
  <g fill="none" stroke-linecap="round">
    <path d="M-100 1500 C700 900 1300 1900 2100 1250 S3300 700 3950 1100" stroke="url(#warm)" stroke-width="300" opacity="0.35" filter="url(#glow)"/>
    <path d="M-100 1500 C700 900 1300 1900 2100 1250 S3300 700 3950 1100" stroke="url(#warm)" stroke-width="90" filter="url(#soft)"/>
    <path d="M-100 1760 C900 1320 1500 2000 2600 1660 S3500 1500 3950 1720" stroke="url(#cool)" stroke-width="200" opacity="0.3" filter="url(#glow)"/>
    <path d="M-100 1760 C900 1320 1500 2000 2600 1660 S3500 1500 3950 1720" stroke="url(#cool)" stroke-width="48" filter="url(#soft)"/>
    <path d="M300 760 C700 420 1150 980 1650 560" stroke="#ffffff" stroke-width="22" opacity="0.18" filter="url(#soft)"/>
  </g>
</svg>
